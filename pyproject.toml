[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2i"
version = "0.1.0"
description = "Param2Image: conditional GAN surrogate for Abaqus impact simulations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Param2Image contributors" }]
dependencies = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "Pillow>=10.0.0",
  "matplotlib>=3.7.0",
  "scikit-image>=0.21.0",
  "scipy>=1.11.0",
  "tqdm>=4.66.0",
  "seaborn>=0.13.0",
  "tensorboard>=2.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
