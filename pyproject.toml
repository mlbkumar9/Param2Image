[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2i"
version = "3.6.0"
description = "Param2Image: conditional GAN surrogate that predicts Abaqus impact field maps from four impact parameters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Mahendralal Behera" },
  { name = "Anil Kumar Sahu" },
  { name = "Vijay Kumar Sutrakar" },
  { name = "Pattabhi Ramaiah Budarapu" },
]
keywords = ["surrogate model", "conditional GAN", "StyleGAN", "finite element", "impact simulation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "torch>=2.1",
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
]

[project.urls]
Homepage = "https://github.com/mlbkumar9/Param2Image"
Issues = "https://github.com/mlbkumar9/Param2Image/issues"

[project.optional-dependencies]
dev = ["pytest"]
fid = ["torchvision"]   # only for the FID/KID scores in p2i.evaluate

[project.scripts]
p2i-train = "p2i.train:main"
p2i-evaluate = "p2i.evaluate:main"
p2i-predict = "p2i.predict:main"
p2i-pack = "p2i.pack_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
